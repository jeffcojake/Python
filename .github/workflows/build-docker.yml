name: Build and Push Docker Image

on:
  push:
    branches:
      - claude/improve-actual-budget-ui-e5rLa
    paths:
      - actual-budget-goals-ui.patch
      - .github/workflows/build-docker.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jeffcojake/actual-budget-custom

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repo (for patch file)
        uses: actions/checkout@v5
        with:
          path: python-repo

      - name: Clone actualbudget/actual at known-good base commit
        run: |
          git clone --depth=1 https://github.com/actualbudget/actual.git actual-budget
          cd actual-budget
          git fetch --depth=1 origin 0025010382586f9936a2b1bfd9a0419f651a8b68
          git checkout 0025010382586f9936a2b1bfd9a0419f651a8b68

      - name: Apply custom patch
        run: |
          cd actual-budget
          git apply ../python-repo/actual-budget-goals-ui.patch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./actual-budget
          file: ./actual-budget/sync-server.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:v1.0
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
